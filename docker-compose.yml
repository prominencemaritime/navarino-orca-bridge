services:
  navarino-orca-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: navarino-orca-bridge
    restart: unless-stopped

    env_file:
      - .env
    
    volumes:
      # Persist logs
      - ./logs:/app/logs
      # Persist state (for future use)
      - ./state:/app/state
      # Persist yaml credentials
      - ./vessels.yaml:/app/vessels.yaml:ro
    
    networks:
      - monitoring
    
    labels:
      - "com.docker.healthcheck.description=Navarino ORCA Bridge Health"

networks:
  monitoring:
    driver: bridge
