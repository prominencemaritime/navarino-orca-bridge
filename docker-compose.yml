services:
  navarino-orca-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: navarino-orca-bridge
    restart: unless-stopped

    env_file:
      - .env
    
    volumes:
      # Persist logs
      - ./logs:/app/logs
      # Persist state (for future use)
      - ./state:/app/state
      # Persist yaml credentials
      - ./vessels.yaml:/app/vessels.yaml:ro
    
    networks:
      - monitoring
    
    labels:
      - "com.docker.healthcheck.description=Navarino ORCA Bridge Health"


  vessel-monitor:
   build:
     context: .
     dockerfile: Dockerfile
   container_name: vessel-monitor
   restart: unless-stopped
   command: ["python3", "-m", "src.monitor"]
   env_file:
     - .env
   volumes:
     - ./logs:/app/logs:ro
     - ./vessels.yaml:/app/vessels.yaml:ro
     - ./monitor:/app/monitor
   healthcheck:
     test: ["CMD", "python3", "/app/scripts/monitor_healthcheck.py"]
     interval: 2m
     timeout: 10s
     start_period: 2m
     retries: 2
   networks:
     - monitoring


networks:
  monitoring:
    driver: bridge
